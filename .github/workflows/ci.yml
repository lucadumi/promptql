name: CI

# Fast, dependency-light checks: lint + unit tests for the deterministic core
# (metrics, prompt formatting, dataset de-leaking). Deliberately does NOT install
# torch/transformers or run training/eval -- those are heavy, need a ~1GB model
# download, and belong in local runs (`make train`, `make eval-ft`).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff, real-error rules only)
        run: ruff check .

      - name: Run tests
        run: pytest
