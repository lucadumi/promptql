# Tooling config for PromptQL. This project is a set of scripts (not a packaged
# library), so there is no [build-system] here on purpose -- only test + lint config.

[tool.pytest.ini_options]
# Tests live in tests/ and import the scripts as `src.<module>`. Adding the repo
# root to the path lets `import src.metrics` work without packaging.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Deliberately conservative: catch real bugs (pyflakes F: unused imports/vars,
# undefined names, bad f-strings) and syntax errors (E9), not style noise. This
# keeps the CI lint gate high-signal and green on the existing code.
select = ["E9", "F"]
